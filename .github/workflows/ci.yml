name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    name: Verify Quality Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Lint codebase
        run: npm run lint

      - name: Typecheck all workspaces
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test:unit

      - name: Run database migration validation
        run: npm run db:migrate

      - name: Run integration test suite
        run: npm run test:integration

      - name: Run security test suite
        run: npm run test:security

      - name: Run end-to-end screen tests
        run: npm run test:e2e

      - name: Run visual and accessibility tests
        run: npm run test:visual

      - name: Run performance and synthetic load validation (T26)
        run: npm run test:load -- --duration=10

      - name: Run hardware verification contract check
        run: npm run test:hardware

      - name: Build all packages and applications
        run: npm run build
